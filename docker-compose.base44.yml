# Base44 sandbox/dev environment for PTE Master Hub (TanStack Start + Vite).
#
# Runs the app FROM THE CLONED SOURCE with the repo bind-mounted, so every edit is
# reflected without rebuilding an image. App entry point: http://localhost:3000.
#
# No database, cache or queue: all progress lives in the browser's localStorage.
# The app contacts no external services, so it needs no credentials/secrets.
#
# Dependencies are installed with bun (the project's pinned package manager:
# bun.lock + bunfig.toml) from the lockfile on every start, after mounts are ready.
#
# Start:  docker compose -f docker-compose.base44.yml up -d
# Logs:   docker compose -f docker-compose.base44.yml logs -f web
# Stop:   docker compose -f docker-compose.base44.yml down
services:
  web:
    image: oven/bun:1
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        bun install --frozen-lockfile
        exec bun ./node_modules/vite/bin/vite.js dev --host 0.0.0.0 --port 3000 --strictPort
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    environment:
      # Bare passthrough so the value comes from the platform (never hardcoded).
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to server.allowedHosts so the preview proxy host is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Bind-mounted sources: poll for changes so hot reload fires reliably in the sandbox.
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    restart: on-failure
    healthcheck:
      # bun has no curl in this image; probe real HTTP responsiveness with bun instead.
      test:
        [
          "CMD-SHELL",
          "bun -e 'const r = await fetch(\"http://127.0.0.1:3000/\").catch(() => null); if (!r || !r.ok) { console.error(\"web not responding\"); process.exit(1); }' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
